[package]
name = "whoop-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure WHOOP BLE wire codec: crc, framing, enums, records, offload. No BLE, no async."

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Derive `Serialize` on the decoded records so a caller can persist them (e.g. whoopctl → JSONL).
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
# Turns the `serde` feature on for this crate's own test build, so the JSONL-shape gate in
# `records` runs under `cargo test -p whoop-protocol` and not only when a workspace member
# (whoopctl) happens to enable the feature for it.
whoop-protocol = { path = ".", features = ["serde"] }
