[package]
name = "whoopctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WHOOP BLE command-line tool."

[[bin]]
name = "whoopctl"
path = "src/main.rs"

[dependencies]
whoop-protocol = { workspace = true, features = ["serde"] }
whoop-client.workspace = true
whoop-metrics.workspace = true
ble-btleplug.workspace = true
tokio = { workspace = true }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
